name: 'The PR Agent'
description: 'Summarize, review and suggest improvements for pull requests'
branding:
  icon: 'award'
  color: 'green'
runs:
  using: 'docker'
  # Build from source rather than a prebuilt image: it keeps the action working
  # without a published :github_action tag, and lets a workflow pin a branch
  # (uses: damnthonyy/dvmn-agent@my-branch) to try changes on a real PR.
  image: 'Dockerfile.github_action'
